
<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <!-- Criterio 1: Meta viewport para diseño responsivo -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>EcoMarket - Productos Ecológicos</title>
    
    <!-- Criterio 3: Integración de Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    
    <!-- Vinculación de tu archivo de estilos personalizados -->
    <link rel="stylesheet" href="css/estilos.css">
</head>
<body>

    <!-- Criterio 3: Navbar responsivo -->
    <nav class="navbar navbar-expand-lg navbar-dark bg-success">
        <div class="container">
            <a class="navbar-brand" href="index.html">EcoMarket</a>
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav" aria-controls="navbarNav" aria-expanded="false" aria-label="Toggle navigation">
                <span class="navbar-toggler-icon"></span>
            </button>
            <div class="collapse navbar-collapse" id="navbarNav">
                <ul class="navbar-nav ms-auto">
                    <li class="nav-item">
                        <a class="nav-link active" aria-current="page" href="index.html">Inicio</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" href="productos.html">Catálogo</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" href="#contacto">Contacto</a>
                    </li>
                </ul>
            </div>
        </div>
    </nav>

    <!-- Contenedor principal donde irá el catálogo -->
    <main class="container my-5">
        <h1 class="text-center mb-4">Bienvenidos a EcoMarket</h1>
        
        <!-- Criterio 2: Input de búsqueda para JavaScript -->
        <div class="row mb-4">
            <div class="col-md-6 mx-auto">
                <input type="text" id="buscador" class="form-control" placeholder="Buscar productos ecológicos...">
            </div>
        </div>

        <!-- Aquí se inyectarán las tarjetas de productos dinámicamente con JS -->
        <div id="catalogo-contenedor" class="row g-4">
            <!-- Las cards irán aquí -->
        </div>

        <!-- INICIO DE MI PARTE: CONTACTO CON BOOTSTRAP -->

        <section id="contacto" class="mt-5 p-4 bg-white rounded shadow-sm">

            <h2 class="text-center text-success mb-4">
                Contáctanos
            </h2>

            <p class="text-center mb-4">
                ¿Tienes alguna consulta sobre nuestros productos ecológicos?
                Escríbenos mediante el siguiente formulario.
            </p>

            <form id="formulario-contacto">

                <div class="row g-3">

                    <div class="col-md-6">
                        <label for="nombre" class="form-label">
                            Nombre completo
                        </label>
                        <input type="text"
                               class="form-control"
                               id="nombre"
                               name="nombre"
                               placeholder="Ingrese su nombre"
                               required>
                    </div>

                    <div class="col-md-6">
                        <label for="correo" class="form-label">
                            Correo electrónico
                        </label>
                        <input type="email"
                               class="form-control"
                               id="correo"
                               name="correo"
                               placeholder="Ingrese su correo"
                               required>
                    </div>

                    <div class="col-12">
                        <label for="asunto" class="form-label">
                            Asunto
                        </label>
                        <input type="text"
                               class="form-control"
                               id="asunto"
                               name="asunto"
                               placeholder="Ingrese el asunto"
                               required>
                    </div>

                    <div class="col-12">
                        <label for="mensaje" class="form-label">
                            Mensaje
                        </label>
                        <textarea class="form-control"
                                  id="mensaje"
                                  name="mensaje"
                                  rows="4"
                                  placeholder="Escriba su mensaje"
                                  required></textarea>
                    </div>

                    <div class="col-12 text-center">
                        <button type="submit" class="btn btn-success px-5">
                            Enviar mensaje
                        </button>
                    </div>

                </div>

            </form>

            <p id="aviso-contacto"
               class="text-center mt-3"
               role="status"
               aria-live="polite"></p>

        </section>

        <script>
            document.getElementById("formulario-contacto")
                .addEventListener("submit", function(evento) {
                    evento.preventDefault();

                    document.getElementById("aviso-contacto")
                        .textContent =
                        "Formulario de demostración: " +
                        "el mensaje no se ha enviado.";
                });
        </script>

    </main>

    <!-- Bootstrap JS (Necesario para el menú móvil) -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
    <!-- Vinculación de tu lógica JavaScript -->
    <script src="js/catalogo.js"></script>
</body>
</html>
