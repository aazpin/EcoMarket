<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <!-- Criterio 1: Meta viewport para diseño responsivo -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>EcoMarket - Productos Ecológicos</title>
    
    <!-- Criterio 3: Integración de Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    
    <!-- Vinculación de tu archivo de estilos personalizados -->
    <link rel="stylesheet" href="css/estilos.css">
</head>
<body>

    <!-- Criterio 3: Navbar responsivo -->
    <nav class="navbar navbar-expand-lg navbar-dark bg-success">
        <div class="container">
            <a class="navbar-brand" href="index.html">EcoMarket</a>
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav" aria-controls="navbarNav" aria-expanded="false" aria-label="Toggle navigation">
                <span class="navbar-toggler-icon"></span>
            </button>
            <div class="collapse navbar-collapse" id="navbarNav">
                <ul class="navbar-nav ms-auto">
                    <li class="nav-item">
                        <a class="nav-link active" aria-current="page" href="index.html">Inicio</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" href="productos.html">Catálogo</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" href="#contacto">Contacto</a>
                    </li>
                </ul>
            </div>
        </div>
    </nav>

    <!-- Contenedor principal donde irá el catálogo -->
    <main class="container my-5">
        <h1 class="text-center mb-4">Bienvenidos a EcoMarket</h1>
        
        <!-- Criterio 2: Input de búsqueda para JavaScript -->
        <div class="row mb-4">
            <div class="col-md-6 mx-auto">
                <input type="text" id="buscador" class="form-control" placeholder="Buscar productos ecológicos...">
            </div>
        </div>

        <!-- Aquí se inyectarán las tarjetas de productos dinámicamente con JS -->
        <div id="catalogo-contenedor" class="row g-4">
            <!-- Las cards irán aquí -->
        </div>
    </main>

    <!-- Bootstrap JS (Necesario para el menú móvil) -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
    <!-- Vinculación de tu lógica JavaScript -->
    <script src="js/catalogo.js"></script>
</body>
</html>
